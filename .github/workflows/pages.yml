name: Check and publish EV Balkan
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Inspect public national data feeds
        run: python3 scripts/inspect-open-data.py
      - name: Restore downloaded registry
        uses: actions/cache/restore@v4
        with:
          path: dist/data
          key: charging-registry-${{ github.run_id }}
          restore-keys: charging-registry-
      - name: Build current charging registry
        run: node scripts/update-charging.mjs
      - name: Save downloaded registry
        uses: actions/cache/save@v4
        with:
          path: dist/data
          key: charging-registry-${{ github.run_id }}
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check phone and desktop browser flows
        run: node scripts/browser-check.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: browser-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
