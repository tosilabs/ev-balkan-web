name: Kontrollo dhe publiko Udhëmbarë
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
env:
  # Kopje publike fillestare; preferohet gjithmonë snapshot-i i repository-t aktual.
  BOOTSTRAP_DATA_URL: https://tosilabs.github.io/ev-balkan-web/
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Restore downloaded registry
        uses: actions/cache/restore@v4
        with:
          path: dist/data
          key: charging-registry-${{ github.run_id }}
          restore-keys: charging-registry-
      - name: Build current charging registry
        run: node scripts/update-charging.mjs
      - name: Download official public feeds
        run: python3 scripts/download-public-sources.py
      - name: Read public Open Charge Map country export
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: openchargemap/ocm-export
          ref: main
          path: .source-cache/ocm-export
          persist-credentials: false
          sparse-checkout: |
            data/referencedata.json
            data/AL
            data/BA
            data/BG
            data/GR
            data/HR
            data/ME
            data/MK
            data/RO
            data/RS
            data/SI
            data/XK
          sparse-checkout-cone-mode: false
      - name: Prepare openly licensed OCM source
        run: node scripts/import-ocm.mjs
      - name: Refresh official operator links and visual identities
        run: python3 scripts/update-providers.py
      - name: Merge official registries and write source catalogue
        run: node scripts/merge-public-sources.mjs
      - name: Save downloaded registry
        uses: actions/cache/save@v4
        with:
          path: dist/data
          key: charging-registry-${{ github.run_id }}
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check phone and desktop browser flows
        timeout-minutes: 3
        run: node scripts/browser-check.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: browser-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
