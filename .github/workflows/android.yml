name: Ndërto Udhëmbarë për Android Auto
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check public registry used by the APK
        run: python3 android/scripts/check-public-registry.py
      - name: Build, unit tests and Android lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -25
          mkdir -p android-output
          cp android/app/build/outputs/apk/debug/app-debug.apk android-output/udhembare-android-auto-0.1.0-test.apk
          cd android-output
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: udhembare-android-auto-apk
          path: android-output/
          if-no-files-found: error
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
  publish-test-apk:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: udhembare-android-auto-apk
          path: android-output
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-auto-0.1.${{ github.run_number }}"
          gh release create "$tag" android-output/* --target "$GITHUB_SHA" --prerelease --title "Udhëmbarë Android Auto · test 0.1.${{ github.run_number }}" --notes-file android/RELEASE_NOTES.md
