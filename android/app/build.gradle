plugins { id 'com.android.application' }
android {
    namespace 'al.udhembare.auto'
    compileSdk 35
    defaultConfig { applicationId 'al.udhembare.auto'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-test' } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { events "failed", "passed"; exceptionFormat "full" } }
    }
    lint { abortOnError true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.car.app:app-testing:1.7.0'
    testImplementation 'androidx.test:core:1.6.1'
}
